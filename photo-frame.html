<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>फोटो फ्रेम | माँ गायत्री कम्प्यूटर</title><style>@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#17233c;font-family:'Baloo 2',sans-serif}header{background:#102a52;color:white;text-align:center;padding:20px}h1{margin:0;font-size:34px}header p{margin:0;font-size:17px}.box{max-width:850px;margin:25px auto;padding:22px;background:white;border-radius:18px;box-shadow:0 8px 25px #10213b12}.controls{display:grid;gap:14px}label{font-weight:700;font-size:17px}input,select{width:100%;padding:12px;border:1px solid #cbd6e6;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:12px 18px;background:#1769e0;color:white;font:700 17px 'Baloo 2';cursor:pointer}.preview{text-align:center;margin-top:22px}canvas{width:100%;max-width:600px;border:1px solid #ddd;border-radius:12px}.back{text-align:center;margin:20px}.back a{color:#1769e0;text-decoration:none;font-weight:700}.actions{margin-top:12px}</style></head><body><header><h1>माँ गायत्री कम्प्यूटर</h1><p>फोटो फ्रेम सेवा</p></header><div class="box"><h2>🖼️ फोटो फ्रेम बनाएं</h2><div class="controls"><div><label>1. अपनी फोटो चुनें</label><input id="photo" type="file" accept="image/*"></div><div><label>2. फ्रेम चुनें</label><select id="frame"><option value="classic">Classic</option><option value="gold">Golden</option><option value="blue">Blue</option><option value="red">Red</option><option value="green">Green</option></select></div><div><label>3. नाम / टेक्स्ट</label><input id="text" type="text" placeholder="जैसे - Amit Jadhav"></div><button onclick="makeFrame()">फोटो फ्रेम तैयार करें</button></div><div class="preview"><canvas id="canvas" width="800" height="800"></canvas><div class="actions"><button onclick="downloadFrame()">⬇️ फोटो डाउनलोड करें</button></div></div></div><div class="back"><a href="index.html">← मुख्य पृष्ठ पर वापस जाएँ</a></div><script>const c=document.getElementById('canvas'),x=c.getContext('2d');let img=null;photo.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=ev=>{img=new Image;img.onload=makeFrame;img.src=ev.target.result};r.readAsDataURL(f)};function makeFrame(){x.clearRect(0,0,800,800);x.fillStyle='#eee';x.fillRect(0,0,800,800);if(img){let s=Math.max(700/img.width,700/img.height),w=img.width*s,h=img.height*s;x.drawImage(img,(800-w)/2,(800-h)/2,w,h)}else{x.fillStyle='#667085';x.font='bold 32px Baloo 2';x.textAlign='center';x.fillText('पहले फोटो चुनें',400,400)}let cs={classic:['#222','#ddd'],gold:['#8b6508','#f4d35e'],blue:['#083b78','#4da3ff'],red:['#7d1515','#ff6262'],green:['#14532d','#4ade80']}[frame.value];x.lineWidth=28;x.strokeStyle=cs[0];x.strokeRect(14,14,772,772);x.lineWidth=8;x.strokeStyle=cs[1];x.strokeRect(30,30,740,740);let t=text.value.trim();if(t){x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,700,800,100);x.fillStyle='#fff';x.font='bold 42px Baloo 2';x.textAlign='center';x.fillText(t,400,765)}}function downloadFrame(){if(!img){alert('पहले फोटो चुनें।');return}let a=document.createElement('a');a.download='maa-gayatri-photo-frame.png';a.href=c.toDataURL('image/png');a.click()}makeFrame();</script></body></html>
